name: Pulse Music CI & Release

on:
  push:
    branches: [ main, master, develop, "feature/*", "fix/*" ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ main, master, develop, "feature/*", "fix/*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required. Release builds must not fall back to debug signing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          test -s release.keystore

      - name: Inject Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is required."
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import json
          import os

          raw = os.environ["GOOGLE_SERVICES_JSON"].strip()
          try:
              json.loads(raw)
          except json.JSONDecodeError:
              raw = base64.b64decode(raw).decode("utf-8")
              json.loads(raw)
          with open("app/google-services.json", "w", encoding="utf-8") as handle:
              handle.write(raw)
          PY

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run JVM Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Build Android APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Release APK Signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --print-certs "$APK"

          EXPECTED_SHA=$(keytool -list -v -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-upload}" 2>/dev/null \
            | awk -F': ' '/SHA(256|-256):/ { print $2; exit }' \
            | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          ACTUAL_SHA=$("$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/SHA-256 digest:/ { print $2; exit }' \
            | tr -d ' :' | tr '[:upper:]' '[:lower:]')

          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::Release APK is not signed with the configured release key."
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi
          echo "Release APK signature matches the configured key."

      - name: Prepare Release APK Artifacts
        id: prepare_apks
        run: |
          VERSION_TAG="${GITHUB_REF_NAME//\//-}"
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ] || [ "$VERSION_TAG" = "master" ]; then
            VERSION_TAG="latest"
          fi

          mkdir -p release-artifacts

          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk \
            "release-artifacts/PulseMusic-${VERSION_TAG}.apk"

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
              "release-artifacts/PulseMusic-${VERSION_TAG}-debug.apk"
          fi

          ls -lh release-artifacts/

      - name: Upload R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pulse-music-apks
          path: release-artifacts/*.apk
          retention-days: 14

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          CLEAN_VERSION="${TAG#v}"

          echo "Extracting release notes for version $CLEAN_VERSION from CHANGELOG.md..."
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$CLEAN_VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release_notes.md
          fi

          if [ ! -s release_notes.md ]; then
            echo "Release $TAG of Pulse Music - Hi-Fi Audio Streaming & Offline Player" > release_notes.md
            echo "" >> release_notes.md
            cat CHANGELOG.md >> release_notes.md 2>/dev/null || true
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
